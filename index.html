<!DOCTYPE html>

<html lang="am"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    
    <title>የአማራ ክልል ማረሚያ ቤት ኮሚሽን ህዝብ ግንኙነት የስራ እንቅስቃሴ(Questionnaire)</title>
    <style>
        
        body { font-family: Arial, sans-serif; margin: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input[type="text"], textarea { width: 10%; padding: 8px; }
        button { padding: 10px 15px; background-color: #0e00cc; color: white; border: none; cursor: pointer; }
    </style>
</head>
<body>

    <h2>የአማራ ክልል ማረሚያ ቤት ኮሚሽን ህዝብ ግንኙነት የስራ እንቅስቃሴ የመረጃ መሰብሰቢያ ጥያቄዎች</h2>

    <form action="https://formsubmit.co/8d4de33bbcc72d3b47aa88404ee85ab6" method="POST">
        
        <div class="form-group">
            <label for="name">ቅፁን የሚሞላው ሰው 
                ማእረግ:፡</label>
            <input type="text" id="name" name="full_name" required="">
        </div>
        <div class="form-group">
            <label for="name">የአገልግሎት ዘመን፡</label>
            <input type="text" id="name" name="service_year" required="">
        </div>
        <div class="form-group">
            <label for="name">የትምህርት ድረጃ፡ </label>
            <input type="text" id="name" name="education_level" required="">
        </div>
        <div class="form-group">
            <label for="name">የስራ ሃላፊነት(ድርሻ)፡ </label>
            <input type="text" id="name" name="job_role" required="">
        </div>
        

        <div class="form-group">
            <label for="feedback">1.የህዝብ ግንኙነት ዳይሬክቶሬት ዳይሬክተር ጠንካራና ደካማ ጎን ምን ምን ናቸው ?:</label>
            <textarea id="feedback" name="q1_feedback" rows="4" style="width: 410px; height: 147px;"></textarea>
        </div>
        
        <div class="form-group">
            <label for="feedback">2.ጥብቃ ደህንነት ዳይሬክቶሬት ዳይሬክተር ጠንካራና ደካማ ጎን ምን ምን ናቸው?:</label>
            <textarea id="feedback" name="q2_feedback" rows="4" style="width: 405px; height: 162px;"></textarea>
        </div>
        <div class="form-group">
            <label for="feedback">3. የህግ ታራሚዎች ፍትህ አስተዳድር ዳይሬክቶሬት ዳይሬክተር ጠንካራና ደካማ ጎን ምን ምን ናቸው?:</label>
            <textarea id="feedback" name="q3_feedback" rows="4" style="width: 411px; height: 193px;"></textarea>
        </div>
        <div class="form-group">
            <label for="feedback">4.የህግ ታራሚዎች መሰረታዊ ፍላጎት ጤና አገልግሎት ዳይሬክቶሬት ዳይሬክተር ጠንካራና ደካማ ጎን ምን ምን ናቸው?:</label>
            <textarea id="feedback" name="q4_feedback" rows="4" style="width: 414px; height: 180px;"></textarea>
        </div>
        <div class="form-group">
            <label for="feedback">5.መረጃ ትንተና ዳይሬክቶሬት ዳይሬክተር ጠንካራና ደካማ ጎን ምን ምን ናቸው?:</label>
            <textarea id="feedback" name="q5_feedback" rows="4" style="width: 420px; height: 184px;"></textarea>
        </div>
        <div class="form-group">
            <label for="feedback">5.ግዥ ፋይናንስ ንብረት አስተዳደር ዳይሬክቶሬት ዳይሬክተር ጠንካራና ደካማ ጎን ምን ምን ናቸው?:</label>
            <textarea id="feedback" name="q6_feedback" rows="4" style="width: 418px; height: 161px;"></textarea>
        </div>
 <div class="form-group">
            <label for="feedback">7.እቅድ ዝግጅት ክትትልና ግምገማ ዳይሬክቶሬት ዳይሬክተር ጠንካራና ደካማ ጎን ምን ምን ናቸው?:</label>
            <textarea id="feedback" name="q7_feedback" rows="4" style="width: 427px; height: 165px;"></textarea>
        </div>
       <div class="form-group">
            <label for="feedback">8.ኦዲት ዳይሬክቶሬት ዳይሬክተር ጠንካራና ደካማ ጎን ምን ምን ናቸው?:</label>
            <textarea id="feedback" name="q8_feedback" rows="4" style="width: 430px; height: 154px;"></textarea>
        </div>
        <div class="form-group">
            <label for="feedback">9.ትምህርትና ስልጠና ዳይሬክቶሬት ዳይሬክተር ጠንካራና ደካማ ጎን ምን ምን ናቸው?:</label>
            <textarea id="feedback" name="q9_feedback" rows="4" style="width: 423px; height: 169px;"></textarea>
        </div>
        
        <div class="form-group">
            <label for="feedback">10.የሰ/ህ/ል/ስራ አመ/ዳይሬክቶሬት ዳይሬክተር ጠንካራና ደካማ ጎን ምን ምን ናቸው?:</label>
            <textarea id="feedback" name="q10_feedback" rows="4" style="width: 425px; height: 144px;"></textarea>
        </div>
        <button type="submit">ላክ(አረጋግጥ) (Submit)</button>
    </form>


</body></html>
